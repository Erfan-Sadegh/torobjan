<div id="processing-state" class="panel">
  <div class="progress-title">{{ processed_count }} از {{ total_count }} ردیف پردازش شده</div>
  <div class="progress-bar">
    <span style="width: {{ progress_percent }}%"></span>
  </div>
  <div class="hint">در حال جستجو در ترب. اگر تعداد ردیف‌ها زیاد باشد کمی زمان می‌برد.</div>
</div>

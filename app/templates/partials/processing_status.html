<div id="processing-state" class="panel">
  <div class="progress-title">{{ processed_count }} از {{ total_count }} ردیف پردازش شده</div>
  <div class="progress-bar">
    <span style="width: {{ progress_percent }}%"></span>
  </div>
  <div class="processing-note">
    <span aria-hidden="true">☕</span>
    <p>
      در حال جستجو در ترب و باسلام. تا پردازش انجام میشه می‌تونی راحت باشی و چند دقیقه دیگه برگردی :)
      {% if total_count >= 500 %}
        فعلا تا ۵۰۰ ردیف اول فایل پردازش می‌شود.
      {% endif %}
    </p>
  </div>
</div>
